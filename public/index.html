    <meta name="theme-color" content="#07090e">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ember">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="mask-icon" href="icons/icon.svg" color="#fbbf24">

    <link rel="preload" href="fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>

  <body>
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-[100] focus:rounded-xl focus:bg-ember-400 focus:px-4 focus:py-2 focus:font-display focus:text-sm focus:font-semibold focus:text-ink-950">Skip to content</a>

      <noscript>
        <main style="max-width: 36rem; margin: 15vh auto; padding: 1.5rem; font-family: system-ui, sans-serif; color: #f1f5f9; background: #0b0f17; border: 1px solid #202b3d; border-radius: 1.5rem;">
          <h1 style="font-size: 1.75rem; margin: 0 0 0.5rem;">Ember needs JavaScript</h1>
          <p style="line-height: 1.6; color: #94a3b8; margin: 0;">The app keeps its state in your browser and cannot run without it. Enable JavaScript and reload — nothing is sent to a server.</p>
        </main>
      </noscript>
    </div>
    <script src="js/main.js" defer></script>
  </body>
